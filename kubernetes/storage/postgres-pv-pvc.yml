apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/postgres/shopnow
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gluster-hostpath
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-master-2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: shopnow
spec:
  volumeName: postgres-pv
  accessModes:
    - ReadWriteOnce
  storageClassName: gluster-hostpath
  resources:
    requests:
      storage: 5Gi
