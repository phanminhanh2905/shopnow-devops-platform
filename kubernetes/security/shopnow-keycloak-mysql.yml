apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/mysql/keycloak
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gluster-hostpath
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-master-2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: shopnow
spec:
  volumeName: mysql-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: gluster-hostpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnow-keycloak-mysql-deployment
  namespace: shopnow
  labels:
    app: shopnow-keycloak-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopnow-keycloak-mysql
  template:
    metadata:
      labels:
        app: shopnow-keycloak-mysql
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master-2
      containers:
        - name: shopnow-keycloak-mysql
          image: mysql:5.7
          imagePullPolicy: Always
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "keycloak"
            - name: MYSQL_USER
              value: "keycloak"
            - name: MYSQL_PASSWORD
              value: "password"
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-data
          ports:
            - containerPort: 3306
              name: mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-keycloak-mysql-service
  namespace: shopnow
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: tcp
      port: 3306
      protocol: TCP
      targetPort: 3306
  selector:
    app: shopnow-keycloak-mysql
  sessionAffinity: None
  type: ClusterIP
