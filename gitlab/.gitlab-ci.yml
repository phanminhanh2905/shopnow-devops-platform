stages:
  - build
  - sonar
  - report
  - deploy

variables:
  DOCKER_IMAGE: "registry.pma-server.site/shopnow/user-service:$CI_COMMIT_SHORT_SHA"
build:
  stage: build
  image: docker:20-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: docker:20-dind
      alias: docker
      command: ["--tls=false", "--insecure-registry=registry.pma-server.site"]
  script:
    # - docker info
    # - docker build -t $DOCKER_IMAGE .
    - apk add --no-cache curl jq
    - >
      SECRETS=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN"
      --request GET "$VAULT_ADDR" | jq -r '.data.data')
    - REGISTRY_USERNAME=$(echo $SECRETS | jq -r '.username')
    - REGISTRY_PASSWORD=$(echo $SECRETS | jq -r '.password')
    - REGISTRY_URL=$(echo $SECRETS | jq -r '.url')
    - docker login -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD" "$REGISTRY_URL"
    - docker push $DOCKER_IMAGE
  tags:
    - runner-shared-1

sonarqube-check:
  : sonar
  image: maven:3.9.9-eclipse-temurin-17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SONAR_HOST_URL: "http://sonarqube.pma-server.site"
    SONAR_TOKEN: "${SONAR_TOKEN}"
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - wget --tries=3 https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.1.0.4889-linux-x64.zip
    - unzip sonar-scanner-cli-7.1.0.4889-linux-x64.zip
    - mv sonar-scanner-7.1.0.4889-linux-x64 /opt/sonar-scanner
    - export PATH=$PATH:/opt/sonar-scanner/bin
  script:
    - mvn clean compile
    - sonar-scanner -Dsonar.java.binaries="./target/classes" -Dsonar.sources="./src/" -Dsonar.projectKey=${CI_PROJECT_NAME} -Dsonar.projectName="$CI_PROJECT_NAME" -Dsonar.projectVersion="${CI_COMMIT_SHORT_SHA}"
  allow_failure: true
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ~/.m2/repository
  tags:
    - runner-shared-1

sonarqube-report:
  : report
  image: node:20
  before_script:
    - apt-get update && apt-get install -y chromium
    - npm install puppeteer
  script:
    - |
      cat > screenshot.js <<'EOF'
      const puppeteer = require('puppeteer');

      (async () => {
        const projectId = process.env.CI_PROJECT_NAME;
        const commitShortSha = process.env.CI_COMMIT_SHORT_SHA;

        const browser = await puppeteer.launch({
          headless: true,
          args: ['--no-sandbox', '--disable-setuid-sandbox'],
          executablePath: '/usr/bin/chromium'
        });

        const page = await browser.newPage();
        await page.setViewport({ width: 1920, height: 1080 });

        await page.goto('http://sonarqube.pma-server.site/sessions/new?return_to=%2F', { waitUntil: 'networkidle2' });

        await page.waitForSelector('#login-input', { timeout: 10000 });
        await page.type('#login-input', 'shopnow');

        await page.waitForSelector('#password-input', { timeout: 10000 });
        await page.type('#password-input', 'ShopNow@123123');

        await Promise.all([
          page.click('button[type="submit"]'),
          page.waitForNavigation({ waitUntil: 'networkidle2' })
        ]);

        const issuesUrl = `http://sonarqube.pma-server.site/project/issues?id=${projectId}&issueStatuses=OPEN%2CCONFIRMED&types=VULNERABILITY`;
        await page.goto(issuesUrl, { waitUntil: 'networkidle2' });

        await page.screenshot({ path: 'sonar-report.png', fullPage: true });

        await browser.close();
      })();
      EOF

    - node screenshot.js

    - |
      curl -s -X POST https://api.telegram.org/bot{$TELE_TOKEN}/sendPhoto  -F chat_id=${TELE_CHAT_ID} -F photo=@sonar-report.png -F caption="SonarQube Report for *${CI_PROJECT_NAME}* (${CI_COMMIT_SHORT_SHA})" -F parse_mode=Markdown
  tags:
    - runner-shared-1



deploy:
  : deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl set image deployment/shopnow-user-service-deployment shopnow-user-service=$DOCKER_IMAGE -n shopnow
  tags:
    - runner-shared-1
